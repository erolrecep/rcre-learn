name: Deploy rcre-learn Web App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Web Suite
        id: locate
        run: |
          if [ -d "apps/rcre-learn/web" ]; then
            echo "web_dir=apps/rcre-learn/web" >> "$GITHUB_OUTPUT"
          else
            echo "web_dir=web" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "${{ steps.locate.outputs.web_dir }}"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
